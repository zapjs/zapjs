[package]
name = "zap-cli"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
publish = false

[[bin]]
name = "zap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
http = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zap-build = { path = "../build" }
zap-execute = { path = "../execute" }
zap-runtime = { path = "../runtime" }

[dev-dependencies]
tempfile = "3"
