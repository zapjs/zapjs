[package]
name = "zap-native-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
napi = { version = "=3.13.0", default-features = false, features = ["napi8", "tokio_rt", "dyn-symbols"] }
napi-derive = "=3.6.9"
zap-native = { path = "../../.." }

[build-dependencies]
napi-build = "=2.5.0"
